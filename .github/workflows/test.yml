name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit + Plugin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Restrict GITHUB_TOKEN to read-only access for repository contents
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: login-delay-shield-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: ./bin/test.sh --configuration phpunit-unit.xml

      - name: Run integration tests
        run: ./bin/test.sh

      - name: Run WP Plugin Check
        run: ./bin/plugin-check.sh
