name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit + Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: login-delay-shield-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PHPUnit
        run: ./bin/test.sh

      - name: Run WP Plugin Check
        run: ./bin/plugin-check.sh
